name: roadbash
description: An original pseudo-3D combat racer built with Flutter + Flame, inspired by classic 16-bit road-combat racers.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.13.5

dependencies:
  animated_text_kit: ^4.3.0
  audioplayers: ^6.2.0
  bloc: ^9.1.0
  connectivity_plus: ^7.0.0
  equatable: ^2.0.7
  flame: ^1.33.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_soloud: ^5.2.1
  freezed_annotation: ^3.1.0
  froom: ^4.0.0
  get_it: ^8.2.0
  go_router: ^18.0.2
  http: ^1.5.0
  injectable: ^2.5.2
  intl: ^0.20.2
  loading_indicator: ^3.1.1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.0
  styled_widget: ^0.4.1
  textstyle_extensions: ^2.0.0-nullsafety
  window_manager: ^0.5.1

dev_dependencies:
  build_runner: ^2.10.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  froom_generator: ^4.0.0
  import_sorter:
    git:
      url: https://github.com/SiroDevs/import_sorter
  injectable_generator: ^2.9.0
  json_serializable: ^6.11.1

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/images/scenes
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/audio/loops/
